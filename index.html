<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="アニ漢">
  <meta name="theme-color" content="#1d1b3a">
  <meta name="description" content="アニメのタイトルやキャラクター名によく使われる漢字1万字を、Apple Pencilの手書きで覚える漢字テストアプリ">
  <title>アニ漢 — アニメ漢字テスト</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <button class="icon-btn" id="btn-back" aria-label="戻る" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
      </button>
      <h1 class="topbar-title" id="topbar-title">アニ漢</h1>
      <div class="topbar-right" id="topbar-right"></div>
    </header>
    <main id="view" class="view" tabindex="-1">
      <div class="loading">
        <div class="loading-kanji">漢</div>
        <p>1万字のデータを読み込み中…</p>
      </div>
    </main>
    <nav class="tabbar" id="tabbar" aria-label="メインメニュー">
      <button data-tab="home"><span class="tab-ico" aria-hidden="true">⌂</span><span>ホーム</span></button>
      <button data-tab="ranks"><span class="tab-ico" aria-hidden="true">段</span><span>ランク</span></button>
      <button data-tab="challenge"><span class="tab-ico" aria-hidden="true">挑</span><span>チャレンジ</span></button>
      <button data-tab="review"><span class="tab-ico" aria-hidden="true">復</span><span>復習</span><span class="tab-badge" id="tab-badge" hidden></span></button>
      <button data-tab="dict"><span class="tab-ico" aria-hidden="true">典</span><span>図鑑</span></button>
      <button data-tab="settings"><span class="tab-ico" aria-hidden="true">⚙</span><span>設定</span></button>
    </nav>
  </div>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="data/kanji-data.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
